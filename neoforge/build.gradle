plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
            gameDirectory = this.mkdir(this.file('runs/client'))
            // cubiomes talks to its native library through the FFM API
            jvmArgument '--enable-native-access=ALL-UNNAMED'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // Seed math (biomes + structure placement), bundled into the jar with NeoForge's jar-in-jar.
    jarJar(implementation("dev.xpple:cubiomes:${project.cubiomes_version}"))
}
