# Important: every field added here that resources need must also be added to
# build-logic/src/main/groovy/multiloader-common.gradle (expandProps).

# Project
version=1.0.1
group=com.kiroxtm
java_version=25

# Common
minecraft_version=26.3
minecraft_version_range=[26.3, 26.4)
mod_name=Kirox Map
mod_author=Kirox
# Must be identical in fabric.mod.json, neoforge.mods.toml and KiroxMap.MOD_ID (NeoForge forbids '-').
mod_id=kirox_map
license=CC0-1.0
credits=
# Shown as the Homepage / Issues buttons in NeoForge's mod list; leave empty to hide them.
mod_homepage=https://www.curseforge.com/minecraft/mc-mods/kirox-map/preview
mod_issues=https://www.curseforge.com/minecraft/mc-mods/kirox-map/preview
description=Full-screen seed map (press M): biomes and structures computed only from the world seed, never from explored terrain.
## Minecraft version that the 'common' project compiles against, list: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.162.0+26.3
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.43-beta
# Lowest NeoForge build the jar accepts (first 26.3 build); the range is open upwards.
neoforge_min_version=26.3.0.0-beta
neoforge_loader_version_range=[4,)

# cubiomes Java bindings (FFM, bundled natives, LGPL-3.0), 26.3 support
cubiomes_version=0.0.0-2026.9.22.1790089484+18edd56575a60fe7129705bf972de0a511437527

# Tests
junit_version=6.1.3

# Gradle
org.gradle.jvmargs=-Xmx3G
