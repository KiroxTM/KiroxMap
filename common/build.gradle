plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

// 'common' only compiles against vanilla Minecraft (NeoForm). No loader API is available here on purpose.
neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    // Seed math. Compile-only here: each loader bundles it into its own jar (Fabric: include, NeoForge: jarJar).
    compileOnly "dev.xpple:cubiomes:${project.cubiomes_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// Layering rule: nothing in common may import Fabric or NeoForge/Forge APIs.
tasks.register('checkLayering') {
    def sources = fileTree('src/main/java') { include '**/*.java' }
    inputs.files(sources)
    doLast {
        def forbidden = ~/^\s*import\s+(static\s+)?net\.(fabricmc|neoforged|minecraftforge)\..*/
        def violations = []
        sources.each { file ->
            file.readLines().eachWithIndex { line, i ->
                if (line ==~ forbidden) {
                    violations << "${file}:${i + 1}: ${line.trim()}"
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("common must be loader-agnostic, found loader imports:\n" + violations.join('\n'))
        }
    }
}
tasks.named('check') { dependsOn 'checkLayering' }
